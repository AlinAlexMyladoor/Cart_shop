{% include 'header.html' %}
<style>
body {
    font-family: Arial, sans-serif;
    margin: 20px;
    background-color: #f7f7f7;
    color: #333;
}

h2 {
    color: #2c3e50;
    text-align: center;
    margin-bottom: 30px;
}

.flex-container {
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 30px;
    padding: 0 5%;
}

.table-container,
.form-container {
    flex: 1 1 48%;
    background-color: #fff;
    padding: 25px;
    border-radius: 8px;
    box-shadow: 0 0 12px rgba(0,0,0,0.1);
    box-sizing: border-box;
}

table {
    width: 100%;
    border-collapse: collapse;
}

table th, table td {
    padding: 12px;
    text-align: center;
    border: 1px solid #ddd;
}

table th {
    background-color: rgb(10, 24, 75);
    color: white;
}

table tr:hover {
    background-color: #f1f1f1;
}

img {
    width: 50px;
    height: auto;
}

a {
    text-decoration: none;
    color: #007BFF;
    font-weight: bold;
}

a:hover {
    color: #0056b3;
}

form {
    width: 100%;
}

form p {
    display: flex;
    flex-direction: column;
    margin-bottom: 16px;
}

form label {
    font-weight: bold;
    margin-bottom: 6px;
    color: #333;
}

form input[type="text"],
form input[type="number"],
form input[type="file"],
form select,
form textarea {
    padding: 10px;
    font-size: 1rem;
    border: 1px solid #ccc;
    border-radius: 4px;
    transition: border-color 0.3s;
}

form input:focus,
form textarea:focus,
form select:focus {
    border-color: #4CAF50;
    outline: none;
}

button,
button[type="submit"] {
    width: 100%;
    background-color: #4CAF50;
    color: white;
    font-size: 1rem;
    padding: 12px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    transition: background-color 0.3s;
    margin-top: 10px;
}

button:hover,
button[type="submit"]:hover {
    background-color: #45a049;
}

/* Responsive tweaks */
@media (max-width: 900px) {
    .flex-container {
        flex-direction: column;
        padding: 0 20px;
    }

    .table-container,
    .form-container {
        flex: 1 1 100%;
    }
}
</style>

<h2>Product Details</h2>
<div class="flex-container">
    <div class="table-container">
        <table>
            <tr>
                <th>Name</th>
                <th>Category</th>
                <th>Price</th>
                <th>Image</th>
                <th>Edit</th>
                <th>Delete</th>
            </tr>
            {% for product in products %}
            <tr>
                <td>{{ product.name }}</td>
                <td>{{ product.category }}</td>
                <td>{{ product.price }}</td>
                <td><img src="{{ product.image.url }}" alt="{{ product.name }}"></td>
                <td><a href="{% url 'edit_product' product.id %}">Edit</a></td>
                <td><a href="{% url 'delete_product' product.id %}">Delete</a></td>
            </tr>
            {% endfor %}
        </table>
    </div>

    <div class="form-container">
       <form method="post" enctype="multipart/form-data">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="btn btn-primary mt-2">Submit</button>
</form>

    </div>
</div>
</body>
</html>
